[project]
name = "keep-focused"
version = "0.2.10"
description = "CLI app to block distracting websites system-wide on Debian (works in all browsers)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "keep-focused" }]
keywords = ["focus", "productivity", "blocker", "hosts", "debian"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = ["click>=8.1", "rich>=13", "rich-click>=1.8"]

[project.urls]
Homepage = "https://github.com/xweinp/keep-focused"
Repository = "https://github.com/xweinp/keep-focused"

[project.scripts]
keep-focused = "keep_focused.cli:main"
kfocus = "keep_focused.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keep_focused"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[project.optional-dependencies]
dev = ["pytest>=7"]
